name: Process music submission

on:
  issues:
    types: [opened, reopened]

permissions: {}

concurrency:
  group: musicmc-catalog-publisher
  cancel-in-progress: false

jobs:
  process:
    if: startsWith(github.event.issue.title, '[Music Upload] ')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write

    steps:
      - name: Check out trusted workflow code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MUSICMC_AUTOMATION_TOKEN || github.token }}

      - name: Mark submission processing
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.MUSICMC_AUTOMATION_TOKEN || github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label music-processing

      - name: Ensure FFmpeg is available
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Install the internal source adapter
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: github-upload-service/actions/package-lock.json

      - name: Install pinned adapter dependencies
        shell: bash
        run: npm ci --ignore-scripts --prefix github-upload-service/actions

      - name: Validate, fetch, transcode, and segment
        id: processor
        continue-on-error: true
        shell: bash
        env:
          NETEASE_COOKIE: ${{ secrets.NETEASE_COOKIE }}
        run: |
          python3 github-upload-service/scripts/process_submission.py \
            --event "$GITHUB_EVENT_PATH" \
            --public-key github-upload-service/config/upload-ticket-public-keys.json \
            --output build \
            --netease-adapter github-upload-service/actions/netease-adapter.cjs

      - name: Build rolling resource bundle
        id: bundler
        if: steps.processor.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -a
          source build/action-output.env
          set +a
          python3 github-upload-service/scripts/build_bundle.py \
            --catalog catalog.json \
            --manifest "$MANIFEST_PATH" \
            --output build \
            --release-tag "bundle-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Publish immutable release
        id: publisher
        if: steps.processor.outcome == 'success' && steps.bundler.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.MUSICMC_AUTOMATION_TOKEN || github.token }}
          STORAGE_BACKEND: ${{ vars.MUSICMC_STORAGE_BACKEND || 'github' }}
          S3_ENDPOINT_URL: ${{ vars.MUSICMC_S3_ENDPOINT_URL }}
          S3_BUCKET: ${{ vars.MUSICMC_S3_BUCKET }}
          S3_PUBLIC_BASE_URL: ${{ vars.MUSICMC_S3_PUBLIC_BASE_URL }}
          S3_PREFIX: ${{ vars.MUSICMC_S3_PREFIX }}
          AWS_ACCESS_KEY_ID: ${{ secrets.MUSICMC_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MUSICMC_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.MUSICMC_S3_REGION || 'auto' }}
        run: |
          set -a
          source build/action-output.env
          set +a
          ASSET_BASE_URL=""
          if [[ "$STORAGE_BACKEND" == "s3" ]]; then
            test -n "$S3_ENDPOINT_URL" -a -n "$S3_BUCKET" -a -n "$S3_PUBLIC_BASE_URL"
            CLEAN_PREFIX="${S3_PREFIX#/}"
            CLEAN_PREFIX="${CLEAN_PREFIX%/}"
            OBJECT_PREFIX="${CLEAN_PREFIX:+$CLEAN_PREFIX/}$RELEASE_TAG"
            ASSET_BASE_URL="${S3_PUBLIC_BASE_URL%/}/$OBJECT_PREFIX"
          elif [[ "$STORAGE_BACKEND" != "github" ]]; then
            echo "Unsupported MUSICMC_STORAGE_BACKEND: $STORAGE_BACKEND" >&2
            exit 2
          fi
          CATALOG_ARGS=(
            --catalog catalog.json
            --manifest "$MANIFEST_PATH"
            --bundle "$BUNDLE_PATH"
            --repository "$GITHUB_REPOSITORY"
          )
          if [[ -n "$ASSET_BASE_URL" ]]; then
            CATALOG_ARGS+=(--asset-base-url "$ASSET_BASE_URL")
          fi
          python3 github-upload-service/scripts/update_catalog.py "${CATALOG_ARGS[@]}"
          ASSETS=(
            "$PACK_PATH#Minecraft resource bundle"
            "$MANIFEST_PATH#MusicMC song manifest"
            "$BUNDLE_PATH#MusicMC bundle manifest"
            "catalog.json#Public MusicMC song catalog"
          )
          if [[ -n "$SOURCE_ARCHIVE_PATH" ]]; then
            ASSETS+=("$SOURCE_ARCHIVE_PATH#Original submitted ZIP")
          fi
          if [[ "$STORAGE_BACKEND" == "github" ]]; then
            gh release create "$RELEASE_TAG" "${ASSETS[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "MusicMC song #${{ github.event.issue.number }}" \
              --notes-file build/release-notes.md \
              >build/publish.log 2>&1
          else
            if ! command -v aws >/dev/null; then
              python3 -m pip install --disable-pip-version-check awscli
            fi
            aws s3 cp "$PACK_PATH" "s3://$S3_BUCKET/$OBJECT_PREFIX/$(basename "$PACK_PATH")" \
              --endpoint-url "$S3_ENDPOINT_URL" --only-show-errors
            aws s3 cp "$MANIFEST_PATH" "s3://$S3_BUCKET/$OBJECT_PREFIX/$(basename "$MANIFEST_PATH")" \
              --endpoint-url "$S3_ENDPOINT_URL" --only-show-errors
            aws s3 cp "$BUNDLE_PATH" "s3://$S3_BUCKET/$OBJECT_PREFIX/$(basename "$BUNDLE_PATH")" \
              --endpoint-url "$S3_ENDPOINT_URL" --only-show-errors
            if [[ -n "$SOURCE_ARCHIVE_PATH" ]]; then
              aws s3 cp "$SOURCE_ARCHIVE_PATH" "s3://$S3_BUCKET/$OBJECT_PREFIX/$(basename "$SOURCE_ARCHIVE_PATH")" \
                --endpoint-url "$S3_ENDPOINT_URL" --only-show-errors
            fi
          fi
          git config user.name "$GITHUB_REPOSITORY_OWNER"
          git config user.email "$GITHUB_REPOSITORY_OWNER@users.noreply.github.com"
          git add catalog.json
          git commit -m "Publish MusicMC song #${{ github.event.issue.number }}"
          git push origin HEAD:main

      - name: Mark submission ready
        if: steps.processor.outcome == 'success' && steps.bundler.outcome == 'success' && steps.publisher.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.MUSICMC_AUTOMATION_TOKEN || github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file build/success-comment.md
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label music-processing --add-label music-ready
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/labels/music-pending" >/dev/null 2>&1 || true
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed

      - name: Mark failed submission
        if: steps.processor.outcome != 'success' || steps.bundler.outcome == 'failure' || steps.publisher.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.MUSICMC_AUTOMATION_TOKEN || github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ ! -f build/error-comment.md ]; then
            mkdir -p build
            printf '%s\n' 'MusicMC could not publish this submission. Inspect the workflow run.' > build/error-comment.md
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file build/error-comment.md
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label music-processing --add-label music-failed
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/labels/music-pending" >/dev/null 2>&1 || true
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason "not planned"

      - name: Remove temporary upload release
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.MUSICMC_AUTOMATION_TOKEN || github.token }}
        run: |
          UPLOAD_TAG=$(python3 github-upload-service/scripts/submission_release.py \
            --event "$GITHUB_EVENT_PATH" \
            --repository "$GITHUB_REPOSITORY")
          if [ -n "$UPLOAD_TAG" ]; then
            gh release delete "$UPLOAD_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          fi
