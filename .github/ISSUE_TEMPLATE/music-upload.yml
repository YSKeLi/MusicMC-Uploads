name: Upload a song / 上传歌曲
description: Submit one server-authorized song to MusicMC
title: "[Music Upload] "
labels:
  - music-pending
body:
  - type: markdown
    attributes:
      value: |
        请先在 Minecraft 服务器执行 `/music upload <歌曲名称>`。
        上传凭证必须有效，ZIP 不得超过 25 MB，且只能包含一个音乐文件。

  - type: input
    id: upload-ticket
    attributes:
      label: 上传凭证
      description: Paste the complete MUS1 ticket generated by the server.
      placeholder: MUS1.payload.signature
    validations:
      required: true

  - type: input
    id: song-name
    attributes:
      label: 歌曲名称
      description: This must exactly match the name used in the Minecraft command.
      placeholder: 晴天
    validations:
      required: true

  - type: input
    id: minecraft-name
    attributes:
      label: Minecraft 玩家名
      description: This must match the player encoded in the upload ticket.
      placeholder: PlayerName
    validations:
      required: true

  - type: upload
    id: music-archive
    attributes:
      label: 音乐 ZIP 文件
      description: Attach one ZIP containing exactly one supported audio file.
      accept: .zip
    validations:
      required: true
